<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Stephen Campbell</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/contact.css" />
  </head>
  <body>
    <header class="museum-header">
      <a class="museum-brand" href="./" aria-label="Return to the portfolio gallery">
        <span>Stephen Campbell<br /><small>Selected Work</small></span>
      </a>
    </header>

    <main class="contact-shell">
      <section class="legacy-gallery" aria-label="Legacy is Built Online">
        <figure class="legacy-frame">
          <div class="legacy-mat">
            <img class="legacy-image" src="./legacy-wall-texture.png?v=20260907" alt="Legacy is Built Online, an etched concrete portrait by Stephen Campbell" decoding="async" />
          </div>
        </figure>
      </section>

      <section class="contact-panel" aria-labelledby="contactTitle">
        <h1 id="contactTitle">Start the<br />conversation.</h1>
        <p class="lede">Tell me what you're building, or what needs improvement, and I can help with what your online presence needs the most.</p>

        <form id="contactForm" class="contact-form">
          <label class="field">
            <span>Your email</span>
            <input id="senderEmail" name="senderEmail" type="email" autocomplete="email" required />
          </label>

          <label class="field">
            <span>Email title</span>
            <input id="messageTitle" name="messageTitle" type="text" maxlength="120" required />
          </label>

          <label class="field field-message">
            <span>Body</span>
            <textarea id="messageBody" name="messageBody" rows="8" maxlength="2400" required></textarea>
          </label>

          <div class="actions">
            <button type="submit">Send message</button>
            <a href="./">Return to gallery</a>
          </div>

          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./src/contact.js"></script>
  </body>
</html>
