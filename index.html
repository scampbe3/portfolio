<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stephen Campbell | Interactive Portfolio Gallery</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/textures/optimized/project-1-runtime.jpg" as="image" fetchpriority="high" />
    <link rel="preload" href="./legacy-wall-texture.png?v=20260907" as="image" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="overlay" id="overlay">
      <div class="loader-atmosphere" aria-hidden="true"></div>
      <div class="overlay-panel">
        <p class="eyebrow">Stephen Campbell</p>
        <div class="gallery-loader" aria-hidden="true">
          <span class="gallery-frame-outline">
            <span class="gallery-portrait-crop">
              <img src="./legacy-wall-texture.png?v=20260907" alt="" />
            </span>
          </span>
        </div>
        <h1 id="overlayTitle"></h1>
        <p class="visually-hidden" id="statusText" aria-live="polite"></p>
        <button id="enterButton" type="button" disabled>Loading...</button>
        <p class="controls-note" id="controlsNote">MOVE: ARROWS / W A S D
LOOK: MOUSE
SPRINT: SHIFT</p>
      </div>
    </div>

    <div class="hud" id="hud">
      <div class="scene-vignette" aria-hidden="true"></div>
    </div>

    <div class="mobile-zone-guide" aria-hidden="true">
      <span class="mobile-zone-bar mobile-zone-turn">
        <span class="mobile-zone-key">
          <span class="mobile-zone-glyph">&#8596;</span>
          <span class="mobile-zone-label">Swipe to turn</span>
        </span>
      </span>
      <span class="mobile-zone-bar mobile-zone-move">
        <span class="mobile-zone-key">
          <span class="mobile-zone-glyph"><span>&#8597;</span><span>&#8596;</span></span>
          <span class="mobile-zone-label">Drag to move</span>
        </span>
      </span>
    </div>

    <script>
      if (window.location.protocol === 'file:') {
        const statusText = document.getElementById('statusText');
        const enterButton = document.getElementById('enterButton');

        statusText.textContent = 'Start the local server with npm start, then open http://localhost:4173/. Browsers block this Three.js gallery when opened as a file.';
        enterButton.disabled = true;
      }
    </script>
    <script type="module" src="./src/main.min.js"></script>
  </body>
</html>
